# Comment @claude on an issue or pull request to ask Claude to explain or fix something. Only people with write access
# to the repo can trigger it, and it works on branches, so you still review and merge its changes.
# Needs the Claude GitHub App on this repo and the repository secret CLAUDE_CODE_OAUTH_TOKEN.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    name: Claude
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
