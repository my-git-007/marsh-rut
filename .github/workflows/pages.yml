# Builds the browser game and publishes it to GitHub Pages.
# Manual only (Actions tab -> "Deploy game to GitHub Pages" -> Run workflow). During testing it publishes
# the BBC recordings too; the sounds check only warns (see SOUNDS.md).
# Optional: set a repository variable VITE_SERVER_URL (e.g. wss://marsh-rut.fly.dev) to turn on multiplayer.
name: Deploy game to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check            # the shared simulation runs headless
      # Testing phase: the BBC archive recordings are published on purpose until permission is obtained or they
      # are replaced (see SOUNDS.md). The check still lists them in the log but no longer stops the deploy.
      # Remove continue-on-error to make it blocking again before a real public launch.
      - run: npm run check:sounds
        continue-on-error: true
      - run: npm run build
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
