<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confirm your email · Hunting LTD</title>
<link rel="icon" href="../icon.ico" sizes="any">
<link rel="icon" href="../icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0b0c0a">
<meta name="apple-mobile-web-app-title" content="Hunting LTD">
<link rel="stylesheet" href="../src/styles/base.css">
<link rel="stylesheet" href="../src/styles/forms.css">
<link rel="stylesheet" href="../src/styles/account.css">
</head>
<body data-root="../" data-acct data-page="confirm-email">
<!-- One of the account pages (the root = log in, /create-account/, /forgot-password/, /reset-password/, /confirm-email/). They share
     src/styles/{base,forms,account}.css and src/pages/account-pages.js; the game itself is /hunting/. -->
<div id="start"><div class="card">
  <h1 class="brand"><picture><source srcset="../badge.webp" type="image/webp"><img src="../badge.jpg" alt="Hunting LTD" width="920" height="460"></picture></h1>
  <div id="acct">
    <div id="v-note" class="af" role="status">
      <h2 id="nt-title">One moment…</h2>
      <p class="lead" id="nt-text"></p>
      <button type="button" id="nt-go" class="primary" hidden></button>
    </div>
    <div id="v-verify" class="af" hidden>
      <h2>Confirm your email</h2>
      <p class="lead">We sent a link to <b id="vf-email"></b>. Open the email and click the link to confirm your address. Then you can sign in and play.</p>
      <p class="lead">Can’t find it? Check your spam or junk folder.</p>
      <button type="button" id="vf-resend" class="secondary" data-busy="Sending…">Send the email again</button>
      <p class="switch"><a href="#" id="vf-logout">Log out</a></p>
    </div>
    <div id="acctmsg" role="alert" aria-live="assertive"></div>
  </div>
</div></div>
<script type="module" src="../src/pages/account-pages.js"></script>
</body>
</html>
