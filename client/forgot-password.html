<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset your password · Hunting LTD</title>
<link rel="icon" href="./icon.ico" sizes="any">
<link rel="icon" href="./icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0b0c0a">
<meta name="apple-mobile-web-app-title" content="Hunting LTD">
<link rel="stylesheet" href="./src/styles/base.css">
<link rel="stylesheet" href="./src/styles/forms.css">
<link rel="stylesheet" href="./src/styles/account.css">
</head>
<body data-acct data-page="forgot-password">
<!-- One of the account pages (index, create-account, forgot-password, reset-password, confirm-email). They share
     src/styles/{base,forms,account}.css and src/pages/account-pages.js; the game itself is hunting.html. -->
<div id="start"><div class="card">
  <h1 class="brand"><picture><source srcset="./badge.webp" type="image/webp"><img src="./badge.jpg" alt="Hunting LTD" width="920" height="460"></picture></h1>
  <div id="acct">
    <form id="f-forgot" class="af" novalidate aria-labelledby="h-forgot">
      <h2 id="h-forgot">Reset your password</h2>
      <p class="lead">Enter the email you signed up with and we’ll send you a link to choose a new password.</p>
      <div class="field">
        <label for="fp-email">Email</label>
        <input type="email" id="fp-email" placeholder="Email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" required>
        <p class="ferr" id="fp-email-err"></p>
      </div>
      <button type="submit" class="primary" data-busy="Sending…">Send reset link</button>
      <p class="switch"><a href="index.html">Back to log in</a></p>
    </form>
    <div id="acctmsg" role="alert" aria-live="assertive"></div>
  </div>
</div></div>
<script type="module" src="./src/pages/account-pages.js"></script>
</body>
</html>
