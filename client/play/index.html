<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hunting LTD</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="../icon.ico" sizes="any" />
    <link rel="icon" href="../icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <meta name="theme-color" content="#0b0c0a" />
    <meta name="apple-mobile-web-app-title" content="Hunting LTD" />
    <link rel="stylesheet" href="../src/styles/base.css" />
    <link rel="stylesheet" href="../src/styles/play.css" />
    <script>
      // Online, this screen needs a logged-in player: without one, go straight to the log-in page.
      // src/pages/play.js checks properly once Firebase has loaded.
      (function () {
        var online = '%VITE_SERVER_URL%';
        if (!online || online.charAt(0) === '%') return;
        try {
          if (!localStorage.getItem('hl-in')) location.replace('../sign-in/');
        } catch (e) {}
      })();
    </script>
  </head>
  <body data-root="../">
    <!-- The screen after logging in (/play/): My Character, Gear, Range, Cabin, then "What do you want to hunt?".
         Only Moose leads anywhere yet: to /hunting/, the moose screen (Choose your hunting grounds).
         "loading": only the logo shows until we know who is logged in; src/pages/play.js removes it. -->
    <div id="start" class="loading">
      <div class="card">
        <h1 class="brand">
          <picture
            ><source srcset="../badge.webp" type="image/webp" />
            <img src="../badge.jpg" alt="Hunting LTD" width="920" height="460"
          /></picture>
        </h1>
        <p id="playmsg" class="playmsg" role="alert"></p>
        <div id="hub">
          <nav class="tools" aria-label="Your hunter">
            <button type="button" class="tile tool" data-soon="My Character">
              <span class="pic"><img src="../menu/character.webp" alt="" width="96" height="96" /></span>
              <span class="lab">My Character</span>
            </button>
            <button type="button" class="tile tool" data-soon="Gear">
              <span class="pic"><img src="../menu/gear.webp" alt="" width="96" height="96" /></span>
              <span class="lab">Gear</span>
            </button>
            <button type="button" class="tile tool" data-soon="The range">
              <span class="pic"><img src="../menu/range.webp" alt="" width="96" height="96" /></span>
              <span class="lab">Range</span>
            </button>
            <button type="button" class="tile tool" data-soon="The cabin">
              <span class="pic"><img src="../menu/cabin.webp" alt="" width="96" height="96" /></span>
              <span class="lab">Cabin</span>
            </button>
          </nav>
          <hr class="sep" />
          <h2 class="hub-h">What do you want to hunt?</h2>
          <div class="game">
            <a class="tile animal" href="../hunting/">
              <span class="pic"><img src="../menu/moose.webp" alt="" width="124" height="124" /></span>
              <span class="lab">Moose</span>
            </a>
            <button type="button" class="tile animal" data-soon="Deer hunting">
              <span class="pic"><img src="../menu/deer.webp" alt="" width="124" height="124" /></span>
              <span class="lab">Deer</span>
            </button>
            <button type="button" class="tile animal" data-soon="Big Horn Sheep hunting">
              <span class="pic"><img src="../menu/bighorn.webp" alt="" width="124" height="124" /></span>
              <span class="lab">Big Horn Sheep</span>
            </button>
            <button type="button" class="tile animal" data-soon="Elk hunting">
              <span class="pic"><img src="../menu/elk.webp" alt="" width="124" height="124" /></span>
              <span class="lab">Elk</span>
            </button>
            <button type="button" class="tile animal wide" data-soon="Bear hunting">
              <span class="pic"><img src="../menu/bear.webp" alt="" width="124" height="124" /></span>
              <span class="lab">Bear</span>
            </button>
          </div>
          <p id="soon" class="soon" role="status"></p>
          <p class="who">
            Logged in as <b id="in-name"></b> <span id="in-email"></span> – <a href="#" id="logout">Log out</a>
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="../src/pages/play.js"></script>
  </body>
</html>
