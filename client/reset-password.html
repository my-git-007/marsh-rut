<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose a new password · Hunting LTD</title>
<link rel="icon" href="./icon.ico" sizes="any">
<link rel="icon" href="./icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0b0c0a">
<meta name="apple-mobile-web-app-title" content="Hunting LTD">
<link rel="stylesheet" href="./src/styles/base.css">
<link rel="stylesheet" href="./src/styles/forms.css">
<link rel="stylesheet" href="./src/styles/account.css">
</head>
<body data-acct data-page="reset-password">
<!-- One of the account pages (index, create-account, forgot-password, reset-password, confirm-email). They share
     src/styles/{base,forms,account}.css and src/pages/account-pages.js; the game itself is hunting.html. -->
<div id="start"><div class="card">
  <h1 class="brand"><picture><source srcset="./badge.webp" type="image/webp"><img src="./badge.jpg" alt="Hunting LTD" width="920" height="460"></picture></h1>
  <div id="acct">
    <div id="v-note" class="af" role="status">
      <h2 id="nt-title">One moment…</h2>
      <p class="lead" id="nt-text"></p>
      <button type="button" id="nt-go" class="primary" hidden></button>
    </div>
    <form id="f-newpass" class="af" hidden novalidate aria-labelledby="h-newpass">
      <h2 id="h-newpass">Choose a new password</h2>
      <p class="lead">For <b id="np-email"></b></p>
      <div class="field">
        <label for="np-pass">New password</label>
        <p class="hint" id="np-pass-hint">At least 8 characters.</p>
        <div class="pw"><input type="password" id="np-pass" placeholder="New password" autocomplete="new-password" minlength="8" aria-describedby="np-pass-hint" required><button type="button" class="reveal" aria-controls="np-pass" aria-pressed="false">Show</button></div>
        <p class="caps" hidden>Caps Lock is on</p>
        <p class="ferr" id="np-pass-err"></p>
      </div>
      <div class="field">
        <label for="np-pass2">Confirm new password</label>
        <div class="pw"><input type="password" id="np-pass2" placeholder="Confirm new password" autocomplete="new-password" minlength="8" required><button type="button" class="reveal" aria-controls="np-pass2" aria-pressed="false">Show</button></div>
        <p class="ferr" id="np-pass2-err"></p>
      </div>
      <button type="submit" class="primary" data-busy="Saving…">Save new password</button>
    </form>
    <div id="acctmsg" role="alert" aria-live="assertive"></div>
  </div>
</div></div>
<script type="module" src="./src/pages/account-pages.js"></script>
</body>
</html>
