<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Log in · Hunting LTD</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="../icon.ico" sizes="any" />
    <link rel="icon" href="../icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <meta name="theme-color" content="#0b0c0a" />
    <meta name="apple-mobile-web-app-title" content="Hunting LTD" />
    <link rel="stylesheet" href="../src/styles/base.css" />
    <link rel="stylesheet" href="../src/styles/forms.css" />
    <link rel="stylesheet" href="../src/styles/account.css" />
    <script>
      // A player who is already logged in sees nothing until we know where to send them (src/pages/account-pages.js).
      (function () {
        try {
          if (localStorage.getItem('hl-in')) document.documentElement.className = 'checking';
        } catch (e) {}
      })();
    </script>
  </head>
  <body data-root="../" data-acct data-page="login">
    <!-- One of the account pages (/sign-in/ = log in, /create-account/, /forgot-password/, /reset-password/, /confirm-email/). They share
     src/styles/{base,forms,account}.css and src/pages/account-pages.js; the game itself is /hunting/. While the game is
     in beta the site's root (client/index.html) is the "Coming early 2027" page, and this page is only reached by its address. -->
    <div id="start">
      <div class="card">
        <h1 class="brand">
          <picture
            ><source srcset="../badge.webp" type="image/webp" />
            <img src="../badge.jpg" alt="Hunting LTD" width="920" height="460"
          /></picture>
        </h1>
        <div id="acct">
          <form id="f-login" class="af" novalidate aria-labelledby="h-login">
            <h2 id="h-login">Log in</h2>
            <div class="field">
              <label for="li-email" id="li-email-label">Email</label>
              <input
                type="email"
                id="li-email"
                tabindex="1"
                placeholder="Email"
                autocomplete="username"
                inputmode="email"
                autocapitalize="off"
                spellcheck="false"
                required
              />
              <p class="ferr" id="li-email-err"></p>
            </div>
            <div class="field fb-only">
              <div class="lrow">
                <label for="li-pass">Password</label
                ><a href="../forgot-password/" id="to-forgot" tabindex="4">Forgot password?</a>
              </div>
              <div class="pw">
                <input
                  type="password"
                  id="li-pass"
                  tabindex="2"
                  placeholder="Password"
                  autocomplete="current-password"
                  required
                /><button type="button" class="reveal" aria-controls="li-pass" aria-pressed="false" tabindex="5">
                  Show
                </button>
              </div>
              <p class="caps" hidden>Caps Lock is on</p>
              <p class="ferr" id="li-pass-err"></p>
            </div>
            <!-- tab order: Email, Password, Log in, then Forgot password? and Show (the only controls on this page) -->
            <button type="submit" class="primary" data-busy="Logging in…" tabindex="3">Log in</button>
            <!-- PRE-LAUNCH: no new accounts until the game goes live. At launch, remove these comment markers to bring
                 the link back, and remove the redirect at the top of create-account/index.html.
            <p class="switch or fb-only">
              <span class="pre">New to Hunting LTD?</span> <a href="../create-account/">Create an account</a>
            </p>
            -->
          </form>
          <div id="acctmsg" role="alert" aria-live="assertive"></div>
        </div>
      </div>
    </div>
    <script type="module" src="../src/pages/account-pages.js"></script>
  </body>
</html>
