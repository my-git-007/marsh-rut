# Fly.io: `fly launch --no-deploy` (pick your own app name), then `fly deploy`.
# One always-on machine: the marsh lives in its memory, so it must not be scaled to several machines.
app = "marsh-rut"
primary_region = "yyz"

[build]

[env]
  PORT = "8080"
  ALLOWED_ORIGINS = "https://my-git-007.github.io"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 50
    hard_limit = 60

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
